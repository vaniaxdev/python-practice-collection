<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables</title>

    <style>
        body {
            background: white;
            font-family: 'Carlito', sans-serif;
        }

        table {
            border: 2px solid black;
            border-collapse: collapse;
            width: 61%;
        }


        th {
            border: 1px solid black;
            padding-top: 10px;
            padding-bottom: 8px;
            text-align: left;
            background: gray;
            color: white;
        }


        td {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>Learning HTML Tables</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Year</th>
        </tr>

        <tr>
            <td>Sylvia</td>
            <td>Information Technology</td>
            <td>Year 2</td>
        </tr>

        <tr>
            <td>Licky</td>
            <td>Computer Science</td>
            <td>Year 2</td>
        </tr>

        <tr>
            <td>Kelvin</td>
            <td>Software Engineering</td>
            <td>Year 3</td>
        </tr>

        <tr>
            <td>Esther</td>
            <td>Data Science</td>
            <td>Year 4</td>
        </tr>

        <tr>
            <td>Precious</td>
            <td>Machine Learning</td>
            <td>Year 1</td>

        </tr>

    </table>
</body>

</html>
